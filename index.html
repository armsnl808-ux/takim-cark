
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif}
.wrap{padding:1rem 0;max-width:480px;margin:0 auto}
canvas{display:block;margin:0 auto}
.result-box{margin:1rem 0;padding:14px 16px;border-radius:12px;background:var(--color-background-secondary);text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center}
.result-text{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.spin-btn{display:block;width:100%;padding:13px;border-radius:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;font-family:inherit;transition:background 0.15s}
.spin-btn:hover{background:var(--color-background-secondary)}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed}
.edit-area{border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-top:12px;background:var(--color-background-primary)}
.edit-title{font-size:12px;color:var(--color-text-secondary);margin-bottom:10px;font-weight:500}
.item-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item-row input{flex:1;padding:7px 10px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:14px;background:var(--color-background-secondary);color:var(--color-text-primary);font-family:inherit;outline:none}
.item-row input:focus{border-color:#378ADD}
.rm-btn{background:none;border:none;color:var(--color-text-secondary);font-size:18px;cursor:pointer;padding:2px 4px;line-height:1}
.add-btn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;font-family:inherit;width:100%}
.add-btn:hover{background:var(--color-background-secondary)}
</style>

<div class="wrap">
  <canvas id="c" width="320" height="320"></canvas>
  <div class="result-box"><span class="result-text" id="result">Takım seçmek için çevir</span></div>
  <button class="spin-btn" id="spinBtn" onclick="spin()">Çevir</button>
  <div class="edit-area">
    <div class="edit-title">Takımları düzenle</div>
    <div id="items"></div>
    <button class="add-btn" onclick="addItem()">+ Takım ekle</button>
  </div>
</div>

<script>
const COLORS=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#be185d','#065f46','#1e40af','#b45309','#0f766e','#9333ea'];

let takimlar=['Takım 1','Takım 2','Takım 3','Takım 4'];
let spinning=false;
let currentAngle=0;

function renderItems(){
  const el=document.getElementById('items');
  el.innerHTML=takimlar.map((t,i)=>`
    <div class="item-row">
      <div style="width:12px;height:12px;border-radius:50%;background:${COLORS[i%COLORS.length]};flex-shrink:0"></div>
      <input value="${t}" oninput="takimlar[${i}]=this.value;drawWheel()" placeholder="Takım adı">
      <button class="rm-btn" onclick="removeItem(${i})">×</button>
    </div>`).join('');
  drawWheel();
}

function addItem(){
  takimlar.push('Yeni takım');
  renderItems();
}

function removeItem(i){
  if(takimlar.length<=2)return;
  takimlar.splice(i,1);
  renderItems();
}

function drawWheel(){
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const cx=W/2,cy=H/2,r=W/2-10;
  ctx.clearRect(0,0,W,H);
  const n=takimlar.length;
  const slice=(2*Math.PI)/n;
  for(let i=0;i<n;i++){
    const start=currentAngle+i*slice;
    const end=start+slice;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start+slice/2);
    ctx.textAlign='right';
    ctx.fillStyle='#fff';
    const fs=n>8?11:13;
    ctx.font=`500 ${fs}px -apple-system,sans-serif`;
    const label=takimlar[i].length>16?takimlar[i].slice(0,14)+'…':takimlar[i];
    ctx.fillText(label,r-12,4);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(cx,cy,18,0,2*Math.PI);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.strokeStyle='#e2e8f0';
  ctx.lineWidth=2;
  ctx.stroke();
  const ow=18;
  ctx.beginPath();
  ctx.moveTo(cx,cy-r-2);
  ctx.lineTo(cx-ow/2,cy-r+ow);
  ctx.lineTo(cx+ow/2,cy-r+ow);
  ctx.closePath();
  ctx.fillStyle='#1e293b';
  ctx.fill();
  ctx.strokeStyle='#fff';
  ctx.lineWidth=1.5;
  ctx.stroke();
}

function spin(){
  if(spinning)return;
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('result').textContent='...';
  const n=takimlar.length;
  const slice=(2*Math.PI)/n;
  const extraSpins=(5+Math.random()*5)*2*Math.PI;
  const stopAngle=Math.random()*2*Math.PI;
  const totalRot=extraSpins+stopAngle;
  const duration=3000+Math.random()*1000;
  const startTime=performance.now();
  const startAngle=currentAngle;
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function frame(now){
    const elapsed=now-startTime;
    const t=Math.min(elapsed/duration,1);
    currentAngle=startAngle+totalRot*easeOut(t);
    drawWheel();
    if(t<1){
      requestAnimationFrame(frame);
    } else {
      currentAngle=startAngle+totalRot;
      drawWheel();
      spinning=false;
      document.getElementById('spinBtn').disabled=false;
      const normalized=(((-currentAngle)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
      const idx=Math.floor(normalized/slice)%n;
      document.getElementById('result').textContent=takimlar[idx];
    }
  }
  requestAnimationFrame(frame);
}

renderItems();
</script>
